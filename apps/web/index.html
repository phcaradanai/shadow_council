<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shadow Council</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10131a;
        color: #f1f4f8;
      }
      body {
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      button,
      input,
      select {
        font: inherit;
        padding: 0.55rem 0.7rem;
        margin: 0.25rem 0.35rem 0.25rem 0;
      }
      button {
        cursor: pointer;
      }
      fieldset,
      section,
      article {
        border: 1px solid #354052;
        border-radius: 0.5rem;
        padding: 1rem;
        margin: 1rem 0;
      }
      .players {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 0.5rem;
      }
      .player {
        background: #181e29;
        padding: 0.75rem;
        border-radius: 0.4rem;
      }
      .muted {
        color: #aeb9c9;
      }
      .error {
        color: #ff9d9d;
      }
    </style>
  </head>
  <body>
    <main id="app"><p>Loading…</p></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
