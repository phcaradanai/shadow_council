name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Code Formatting Check (Prettier)
        run: npm run format:check

      - name: Static Type Check (TypeScript)
        run: npm run typecheck

      - name: Architectural Boundaries & Dependency Cycle Check
        run: npm run architecture:check

      - name: Physical File Size Budget Check
        run: npm run size:check

      - name: Build Packages & Applications
        run: npm run build

      - name: Unit & Integration Test Suites (Vitest)
        run: npm test

      - name: Real Browser End-to-End Test Automation (Playwright)
        run: npm run test:e2e
